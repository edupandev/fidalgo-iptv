name: Build FidalGO TV Native APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
  ANDROID_SDK_ROOT: ${{ runner.home }}/android-sdk

jobs:
  build:
    name: Build Release APK (Native Leanback + ExoPlayer)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27c
          build-tools-version: '34.0.0'
          cmdline-tools-version: 'latest'
          emulator: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure gradle.properties
        run: |
          cd android-tv-native
          cat > local.properties << EOF
          sdk.dir=${{ env.ANDROID_SDK_ROOT }}
          EOF
          
          if [ -n "${{ secrets.FIDALGO_API_URL }}" ]; then
            sed -i "s|fidalgo_api_base_url=.*|fidalgo_api_base_url=${{ secrets.FIDALGO_API_URL }}|" gradle.properties
          fi
          if [ -n "${{ secrets.FIDALGO_LOCAL_URL }}" ]; then
            sed -i "s|fidalgo_api_local_url=.*|fidalgo_api_local_url=${{ secrets.FIDALGO_LOCAL_URL }}|" gradle.properties
          fi
          
          echo "Using base URL: $(grep fidalgo_api_base_url gradle.properties)"

      - name: Tornar gradlew executável
        run: chmod +x ./android-tv-native/gradlew

      - name: Build Release APK
        working-directory: ./android-tv-native
        run: |
          ./gradlew clean assembleRelease --no-daemon --info
        env:
          GRADLE_OPTS: ${{ env.GRADLE_OPTS }}

      - name: Verificar APK gerado
        run: |
          APK_PATH=$(find ./android-tv-native/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -f "$APK_PATH" ]; then
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "APK encontrado: $APK_PATH"
            echo "Tamanho: $APK_SIZE"
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          else
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

      - name: Assinar APK (se keystore disponível)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          
          cat >> ./android-tv-native/app/build.gradle.kts << 'SIGNING_EOF'
          
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          SIGNING_EOF
          
          cd android-tv-native
          ./gradlew clean assembleRelease --no-daemon
          
          SIGNED_APK=$(find ./app/build/outputs/apk/release -name "*-release.apk" | head -1)
          echo "APK_PATH=$SIGNED_APK" >> $GITHUB_ENV
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Upload APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fidalgo-tv-native-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30
          compression-level: 6

      - name: Criar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: "FidalGO TV Native v${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 FidalGO TV Native - Android TV App
            
            **APK Nativo 100% (Leanback + ExoPlayer)** — ~5-8MB
            
            ### Funcionalidades
            
            #### Interface tvOS Style
            - Hero Preview Dinâmico (45-55% altura, gradiente, EPG progress, logo do canal)
            - Category Pills (Segmented Control horizontal, glassmorphism)
            - Channel Rail Horizontal (NÃO grid, flex-wrap: nowrap, 16:9)
            - Focus tvOS Style (scale 1.08, border 3px white, glow, auto-scroll center)
            - EPG Progress no Hero (barra 3px + "% concluído")
            - Legenda de prévia ao focar ("Passando agora: {programa}")
            
            #### Player Nativo ExoPlayer
            - HLS, DASH, SmoothStreaming
            - DRM (Widevine, PlayReady, ClearKey)
            - Múltiplas faixas de áudio (pt-BR, en, es, etc.)
            - Legendas WebVTT/TTML/SRT (externas + embutidas)
            - Cache offline (200MB, LRU)
            
            #### Controle Remoto Nativo
            - D-Pad (navegação, foco, seleção)
            - Media Keys: Play/Pause, ±10s/±30s, Next/Previous
            - Back button → histórico/fecha app
            - Home → minimiza
            - Info → detalhes do canal
            
            #### Integração fidalGO API
            - /api/saimo-channels (Canais Saimo + Ramys + VIP)
            - /api/saimo-vod (Filmes & Séries)
            - /api/resolve-vod (Resolve stream VOD)
            - /api/epg / /api/epg/all (EPG completo)
            - /api/events (Agenda esportes)
            - /api/proxy (Proxy HLS/DASH com Range 206)
            - /api/search (Busca unificada)
            - /api/subtitles (Legendas)
            
            #### Configurações
            - Base URL: https://fidalgotv.ngrok.app/ (configurável)
            - Fallback local: http://192.168.1.15:5000/
            - Favoritos, Recentes, Controle Parental
            - Busca por voz/teclado (SearchFragment)
            
            ---
            
            **Tamanho:** ~5-8MB (R8 + shrinkResources)  
            **Min SDK:** 21 (Android 5.0)  
            **Target SDK:** 34 (Android 14)  
            **Launcher:** Leanback (aparece na Home da TV)  
            **Banner:** 320x180 dp | **Ícone:** Adaptive Icon
            
            ---
            
            ### Instalação na TV
            ```bash
            adb install -r FidalGO-TV-Native-v${{ github.ref_name }}.apk
            ```
            Ou use o app **Downloader** na TV: https://fidalgotv.ngrok.app/apk