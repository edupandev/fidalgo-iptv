<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>fidalGO TV D-Pad & Remote Showcase</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #appFrame { width: 100vw; height: 100vh; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="/index.html"></iframe>
  <script>
    window.onload = () => {
      const frame = document.getElementById('appFrame');
      setTimeout(() => {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;

        // 1. Abre a reprodução de um canal no Palco TV
        if (win.channels && win.channels.length > 0) {
          win.playChannel(win.channels[0], 0);
        }

        setTimeout(() => {
          // 2. Dispara o OSD de controle remoto (Avanço de 10s no D-Pad)
          if (win.TVNavigation) {
            win.TVNavigation.showPlayerOsd('+10s', '⏩');

            // 3. Destaca o botão Áudio & Legendas (CC) com foco do controle remoto
            const ccBtn = doc.getElementById('btnPlayerAudioSubs');
            if (ccBtn) {
              win.TVNavigation.setFocus(ccBtn, false);
            }
          }
        }, 1200);
      }, 1500);
    };
  </script>
</body>
</html>
