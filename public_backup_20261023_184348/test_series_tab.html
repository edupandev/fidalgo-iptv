<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#000;">
<iframe id="f" src="http://127.0.0.1:3080/#series" style="width:100vw;height:100vh;border:0;"></iframe>
<script>
window.onload = () => {
  setTimeout(() => {
    try {
      const win = document.getElementById('f').contentWindow;
      win.switchTab('series');
    } catch(_) {}
  }, 1500);
};
</script>
</body>
</html>
